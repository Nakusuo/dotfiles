# Portado desde frangkli/dotfiles (alacritty.yml, 2020) a TOML para Alacritty 0.17
# Respaldo del config anterior: alacritty.toml.bak-20260924

[env]
IS_ALACRITTY = "1"

[general]
import = ["~/.config/alacritty/verdetech.toml"]  # cambia aquí de tema
live_config_reload = true

# Usar zsh (Powerlevel10k, ~/.p10k.zsh) en Alacritty; fish sigue como shell por defecto
[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }

[window]
padding = { x = 15, y = 15 }
dynamic_padding = true
decorations = "None"
startup_mode = "Windowed"
dynamic_title = true
opacity = 0.85
blur = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10.5
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 1 }

[bell]
animation = "EaseOutExpo"
duration = 0
color = "0xffffff"

[selection]
semantic_escape_chars = ",|`:\"' ()[]{}<>"
save_to_clipboard = false

[cursor]
style = { shape = "Block" }
unfocused_hollow = true

[mouse]
hide_when_typing = false
bindings = [
  { mouse = "Middle", action = "PasteSelection" },
]

[keyboard]
bindings = [
  { key = "Slash", mods = "Alt", chars = "\\" },
  # Los originales usaban Command (solo macOS); reasignados a Control+Shift
  { key = "K", mods = "Control|Shift", action = "ClearHistory" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]
